<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>KG Analiz — Şifre Sıfırlama</title>
<style>
  :root {
    --bg: #0A0F1C;
    --surface: #111A2B;
    --input: #141E30;
    --border: #22304A;
    --text: #F1F5F9;
    --muted: #8CA0B8;
    --accent: #E11D48;
    --error: #FCA5A5;
    --success: #4ADE80;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px 16px;
  }
  .card {
    width: 100%;
    max-width: 420px;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 18px;
    padding: 32px 24px;
  }
  h1 { font-size: 22px; margin: 0 0 6px; text-align: center; }
  .sub { color: var(--muted); font-size: 14px; text-align: center; margin-bottom: 26px; line-height: 1.5; }
  label { display: block; font-size: 13px; color: var(--muted); margin-bottom: 6px; }
  input {
    width: 100%;
    height: 50px;
    background: var(--input);
    border: 1px solid var(--border);
    border-radius: 12px;
    color: var(--text);
    padding: 0 14px;
    font-size: 15px;
    margin-bottom: 16px;
    outline: none;
  }
  input:focus { border-color: var(--accent); }
  button {
    width: 100%;
    height: 50px;
    background: var(--accent);
    color: #FFF1F2;
    border: none;
    border-radius: 12px;
    font-size: 15px;
    font-weight: 800;
    cursor: pointer;
  }
  button:disabled { opacity: 0.6; cursor: not-allowed; }
  .msg {
    border-radius: 10px;
    border: 1px solid;
    padding: 12px 14px;
    font-size: 13.5px;
    line-height: 1.5;
    margin-bottom: 16px;
    display: none;
  }
  .msg.error { display: block; color: var(--error); background: rgba(252,165,165,.08); border-color: rgba(252,165,165,.35); }
  .msg.ok    { display: block; color: var(--success); background: rgba(74,222,128,.08); border-color: rgba(74,222,128,.35); }
  .logo { text-align: center; font-size: 26px; font-weight: 900; letter-spacing: .5px; margin-bottom: 4px; }
  .logo span { color: var(--accent); }
</style>
</head>
<body>
<div class="card">
  <div class="logo">KG <span>ANALİZ</span></div>
  <h1>Yeni Şifre Belirle</h1>
  <p class="sub">Hesabın için yeni bir şifre oluştur. Ardından uygulamaya yeni şifrenle giriş yapabilirsin.</p>

  <div id="msg" class="msg"></div>

  <div id="form">
    <label for="pw1">Yeni şifre (en az 6 karakter)</label>
    <input type="password" id="pw1" placeholder="••••••" autocomplete="new-password">

    <label for="pw2">Yeni şifre (tekrar)</label>
    <input type="password" id="pw2" placeholder="••••••" autocomplete="new-password">

    <button id="btn">Şifremi Güncelle</button>
  </div>
</div>

<script type="module">
  import { createClient } from 'https://esm.sh/@supabase/supabase-js@2';

  // ⚠️ Buraya kendi Supabase bilgilerini yaz (publishable/anon key — service_role DEĞİL!)
  const SUPABASE_URL = 'https://fryivfpbnqophkwuldfm.supabase.co';
  const SUPABASE_ANON_KEY = 'sb_publishable_P8UllUdmPjDvlU081eOpKQ_Q05VEyjz';

  const supabase = createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

  const msgEl = document.getElementById('msg');
  const formEl = document.getElementById('form');
  const btn = document.getElementById('btn');

  const show = (text, type) => {
    msgEl.textContent = text;
    msgEl.className = 'msg ' + type;
  };

  // Supabase, maildeki linkten gelen oturumu otomatik kurar.
  // Oturum yoksa (link süresi dolmuş veya doğrudan girilmiş) uyarı ver.
  const { data: { session } } = await supabase.auth.getSession();
  if (!session) {
    // URL'deki token'ı işlemesi için kısa bir bekleme
    await new Promise(r => setTimeout(r, 800));
    const retry = await supabase.auth.getSession();
    if (!retry.data.session) {
      show('Bu bağlantı geçersiz veya süresi dolmuş. Lütfen uygulamadan yeniden "Şifremi unuttum" isteği gönder.', 'error');
      formEl.style.display = 'none';
    }
  }

  btn.addEventListener('click', async () => {
    const pw1 = document.getElementById('pw1').value;
    const pw2 = document.getElementById('pw2').value;

    if (!pw1 || !pw2) { show('Lütfen her iki alanı da doldur.', 'error'); return; }
    if (pw1.length < 6) { show('Şifre en az 6 karakter olmalı.', 'error'); return; }
    if (pw1 !== pw2) { show('Şifreler birbiriyle uyuşmuyor.', 'error'); return; }

    btn.disabled = true;
    btn.textContent = 'Güncelleniyor...';

    const { error } = await supabase.auth.updateUser({ password: pw1 });

    if (error) {
      show(error.message, 'error');
      btn.disabled = false;
      btn.textContent = 'Şifremi Güncelle';
    } else {
      show('Şifren başarıyla güncellendi! Artık uygulamaya yeni şifrenle giriş yapabilirsin.', 'ok');
      formEl.style.display = 'none';
    }
  });
</script>
</body>
</html>
